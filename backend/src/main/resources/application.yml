# 기본값과 의미는 README.md "설정" 절에 정리한다. 비밀값은 환경변수 또는 루트 .env(커밋 금지)로만 넣는다.
spring:
  application:
    name: rag-quality-lab
  config:
    # 로컬 개발 시 저장소 루트의 .env를 읽는다 (Compose와 같은 파일 사용). 테스트 태스크는 RQL_ENV_FILE로 끈다
    import: "optional:file:${RQL_ENV_FILE:../.env}[.properties]"
  datasource:
    url: jdbc:postgresql://${RQL_DB_HOST:localhost}:${RQL_DB_PORT:15432}/${RQL_DB_NAME:rql}
    username: ${RQL_DB_USER:rql}
    password: ${RQL_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      # 업로드 상한(승인 #13). 실제 검증은 app.document.max-upload-size로 한 번 더 한다
      max-file-size: ${app.document.max-upload-size}
      max-request-size: 11MB
  autoconfigure:
    # 기본 사용자·임시 비밀번호 생성(로그 출력)을 막는다. 관리자 계정은 DB(admin_users)만 사용
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  ai:
    model:
      # ADR-0004/0003: 채팅은 Gemini, 임베딩은 Ollama. 다른 공급자의 같은 역할 자동설정은 끈다
      # Spring AI는 Gemini 키가 비어 있으면 기동에 실패한다. 키가 없을 때는 RQL_CHAT_PROVIDER=none으로 채팅 기능만 끈다
      chat: ${RQL_CHAT_PROVIDER:google-genai}
      embedding: ollama
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          model: ${RQL_GENERATION_MODEL:gemini-3.5-flash-lite}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        # 자동 다운로드 금지. 모델은 README 절차로 수동 pull
        pull-model-strategy: never
      embedding:
        model: ${RQL_EMBEDDING_MODEL:qwen3-embedding:0.6b}

server:
  port: ${RQL_API_PORT:18080}
  # 호스트 실행 시 LAN에 노출하지 않는다 (ADR-0008). 컨테이너에서는 0.0.0.0
  address: ${RQL_API_BIND:127.0.0.1}
  servlet:
    session:
      # 관리자 세션 (docs/phase0/05_api_contract.md 0절)
      timeout: ${RQL_ADMIN_SESSION_TIMEOUT:30m}
      cookie:
        name: rql_admin
        http-only: true
        same-site: strict
        # 로컬 HTTP 개발에서는 false. HTTPS 배포 시 true
        secure: ${RQL_COOKIE_SECURE:false}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: always
  health:
    defaults:
      enabled: true

app:
  ollama:
    health-timeout: 2s
  document:
    max-upload-size: 10MB
    upload-dir: ${RQL_UPLOAD_DIR:../data/uploads}
    chunk-size-chars: 800
    chunk-overlap-chars: 120
    processing-threads: 1
  embedding:
    dimensions: 1024
    batch-size: 16
    # 질의 앞에 붙이는 instruction. 기본은 빈 값(ADR-0003 Phase 2 측정: 접두어 없음이 MRR 0.833 > 0.717).
    # Qwen3 권장 형식을 쓰려면 예: "Instruct: Given a Korean technical question about Java and Spring, retrieve relevant passages that answer it\nQuery:"
    query-instruction: ${RQL_EMBEDDING_QUERY_INSTRUCTION:}
  retrieval:
    top-k: 5
  admin:
    max-failed-attempts: 5
    lock-duration: 15m
    min-password-length: 12
